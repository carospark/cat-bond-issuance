[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-bond-issuance"
version = "0.1.0"
description = "Structured extraction of the public catastrophe bond deal directory"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "scipy",
    "requests",
    "beautifulsoup4",
]

[tool.setuptools]
package-dir = {"" = "src"}
